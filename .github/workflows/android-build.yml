name: Build Android apps

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android-app/**"
      - "src/**"
      - "public/**"
      - "scripts/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/android-build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Build and bundle the website
        run: |
          npm ci
          npm run sync:android

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 platform
        run: sdkmanager "platforms;android-36"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build Free and Paid APKs and AABs
        run: |
          gradle -p android-app assembleFreeDebug assemblePaidDebug bundleFreeRelease bundlePaidRelease

      - name: Rename APKs and bundles
        run: |
          cp android-app/app/build/outputs/apk/free/debug/app-free-debug.apk balance-sheet-square-free.apk
          cp android-app/app/build/outputs/apk/paid/debug/app-paid-debug.apk balance-sheet-square-paid.apk
          cp android-app/app/build/outputs/bundle/freeRelease/app-free-release.aab balance-sheet-square-free.aab
          cp android-app/app/build/outputs/bundle/paidRelease/app-paid-release.aab balance-sheet-square-paid.aab

      - name: Upload Free APK
        uses: actions/upload-artifact@v4
        with:
          name: balance-sheet-square-free-apk
          path: balance-sheet-square-free.apk

      - name: Upload Paid APK
        uses: actions/upload-artifact@v4
        with:
          name: balance-sheet-square-paid-apk
          path: balance-sheet-square-paid.apk

      - name: Upload Free AAB
        uses: actions/upload-artifact@v4
        with:
          name: balance-sheet-square-free-aab
          path: balance-sheet-square-free.aab

      - name: Upload Paid AAB
        uses: actions/upload-artifact@v4
        with:
          name: balance-sheet-square-paid-aab
          path: balance-sheet-square-paid.aab

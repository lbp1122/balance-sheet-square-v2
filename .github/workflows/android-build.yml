name: Build Android apps

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android-app/**"
      - "src/**"
      - "public/**"
      - "scripts/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/android-build.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Prepare full-size launcher icon
        run: |
          python3 -m pip install --quiet pillow
          python3 scripts/prepare-launcher-icon.py

      - name: Test retirement calculations
        run: npm run test:retirement

      - name: Build and bundle the website
        run: |
          npm ci
          npm run sync:android

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 platform
        run: sdkmanager "platforms;android-36"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build direct Paid APK and Free-to-Paid AAB
        run: |
          gradle -p android-app assembleDebug -PdirectPaid=true
          gradle -p android-app bundleRelease

      - name: Rename APK and bundle
        run: |
          cp android-app/app/build/outputs/apk/debug/app-debug.apk my-wealth-square-paid.apk
          cp android-app/app/build/outputs/bundle/release/app-release.aab my-wealth-square-free-to-paid.aab

      - name: Read app version
        id: app_version
        run: |
          VERSION_NAME=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' android-app/app/build.gradle.kts)
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: Publish permanent GitHub download links
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.app_version.outputs.version_name }}
          name: My Wealth Square v${{ steps.app_version.outputs.version_name }}
          generate_release_notes: true
          files: |
            my-wealth-square-paid.apk
            my-wealth-square-free-to-paid.aab

      - name: Upload direct Paid APK
        uses: actions/upload-artifact@v4
        with:
          name: my-wealth-square-paid-apk
          path: my-wealth-square-paid.apk

      - name: Upload Free-to-Paid AAB
        uses: actions/upload-artifact@v4
        with:
          name: my-wealth-square-free-to-paid-aab
          path: my-wealth-square-free-to-paid.aab
